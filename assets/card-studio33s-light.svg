<svg xmlns="http://www.w3.org/2000/svg" width="480" height="236" viewBox="0 0 480 236" role="img" aria-label="Studio 33s: Live studio site with its own headless CMS: Fastify API, SQLite, admin SPA, 360° tours."><title>Studio 33s: Live studio site with its own headless CMS: Fastify API, SQLite, admin SPA, 360° tours.</title><style>
    .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace}
    .spin{animation:spin 6s linear infinite} .slow{animation-duration:14s} .rev{animation-direction:reverse;animation-duration:20s}
    @keyframes spin{to{transform:rotate(360deg)}}
    .slide{animation:slide 4s linear infinite} @keyframes slide{to{transform:translateX(-70px)}}
    .pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center} @keyframes pulse{50%{transform:scale(1.8);opacity:.4}}
    .eqb{animation:eq 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center} @keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
    .tok{animation:tok 1.8s cubic-bezier(.2,.8,.2,1) infinite;opacity:0} @keyframes tok{0%{opacity:0;transform:translateY(6px)}30%,70%{opacity:1;transform:none}100%{opacity:0}}
    .b1{animation:pop 3s ease-in-out infinite} .b2{animation:pop 3s ease-in-out infinite;animation-delay:1.2s}
    @keyframes pop{0%,10%{opacity:0;transform:translateY(4px)}25%,85%{opacity:1;transform:none}100%{opacity:0}}
    .dot{animation:dot 1s ease-in-out infinite} @keyframes dot{50%{transform:translateY(-3px)}}
    .sweep{animation:sweep 5s cubic-bezier(.45,0,.2,1) infinite} @keyframes sweep{0%{transform:translateX(-200px)}60%,100%{transform:translateX(480px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
    <defs><clipPath id="f"><rect width="480" height="236" rx="18"/></clipPath>
      <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#0d9c6b" stop-opacity="0"/><stop offset=".5" stop-color="#0d9c6b" stop-opacity=".9"/><stop offset="1" stop-color="#0d9c6b" stop-opacity="0"/></linearGradient>
      <radialGradient id="gl"><stop offset="0" stop-color="#0d9c6b" stop-opacity=".22"/><stop offset="1" stop-color="#0d9c6b" stop-opacity="0"/></radialGradient></defs>
    <g clip-path="url(#f)">
      <rect width="480" height="236" fill="#f7f8fa"/>
      <circle cx="420" cy="40" r="170" fill="url(#gl)" opacity=".35"/>
      <rect class="sweep" y="0" width="200" height="2" fill="url(#sw)"/>
    </g>
    <rect x=".5" y=".5" width="479" height="235" rx="18" fill="none" stroke="#e2e5eb"/>
    <circle cx="33" cy="36" r="4.5" fill="#0d9c6b"/>
    <text x="46" y="41" class="mono" font-size="13.5" letter-spacing=".6" fill="#5b6475">LIVE · studio33s.com</text>
    <text x="27" y="88" class="sans" font-size="31" font-weight="700" letter-spacing="-.6" fill="#14161c">Studio 33s</text>
    <text x="28" y="124" class="sans" font-size="17.5" fill="#5b6475">Live studio site with its own headless CMS:</text><text x="28" y="150" class="sans" font-size="17.5" fill="#5b6475">Fastify API, SQLite, admin SPA, 360° tours.</text>
    <rect x="28" y="182" width="98" height="30" rx="15" fill="#f0f2f5" stroke="#e2e5eb"/><text x="39" y="202" class="mono" font-size="14" fill="#5b6475">Fastify 5</text><rect x="133.6" y="182" width="72" height="30" rx="15" fill="#f0f2f5" stroke="#e2e5eb"/><text x="144.6" y="202" class="mono" font-size="14" fill="#5b6475">SQLite</text><rect x="214.0" y="182" width="89" height="30" rx="15" fill="#f0f2f5" stroke="#e2e5eb"/><text x="225.0" y="202" class="mono" font-size="14" fill="#5b6475">React 18</text><rect x="311.2" y="182" width="56" height="30" rx="15" fill="#f0f2f5" stroke="#e2e5eb"/><text x="322.2" y="202" class="mono" font-size="14" fill="#5b6475">GSAP</text>
    <g transform="translate(422,56)"><circle r="26" fill="none" stroke="#e2e5eb" stroke-width="1.5"/><ellipse rx="26" ry="9" fill="none" stroke="#0d9c6b" stroke-width="1.5" opacity=".5"/><g class="spin"><circle cx="26" r="4" fill="#0d9c6b"/></g><circle r="5" fill="#0d9c6b" opacity=".85"/></g>
    </svg>