<svg xmlns="http://www.w3.org/2000/svg" width="480" height="236" viewBox="0 0 480 236" role="img" aria-label="Agency 3D: Next.js platform with admin and a 3D front: Prisma on Turso, NextAuth, React Three Fiber."><title>Agency 3D: Next.js platform with admin and a 3D front: Prisma on Turso, NextAuth, React Three Fiber.</title><style>
    .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace}
    .spin{animation:spin 6s linear infinite} .slow{animation-duration:14s} .rev{animation-direction:reverse;animation-duration:20s}
    @keyframes spin{to{transform:rotate(360deg)}}
    .slide{animation:slide 4s linear infinite} @keyframes slide{to{transform:translateX(-70px)}}
    .pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center} @keyframes pulse{50%{transform:scale(1.8);opacity:.4}}
    .eqb{animation:eq 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center} @keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
    .tok{animation:tok 1.8s cubic-bezier(.2,.8,.2,1) infinite;opacity:0} @keyframes tok{0%{opacity:0;transform:translateY(6px)}30%,70%{opacity:1;transform:none}100%{opacity:0}}
    .b1{animation:pop 3s ease-in-out infinite} .b2{animation:pop 3s ease-in-out infinite;animation-delay:1.2s}
    @keyframes pop{0%,10%{opacity:0;transform:translateY(4px)}25%,85%{opacity:1;transform:none}100%{opacity:0}}
    .dot{animation:dot 1s ease-in-out infinite} @keyframes dot{50%{transform:translateY(-3px)}}
    .sweep{animation:sweep 5s cubic-bezier(.45,0,.2,1) infinite} @keyframes sweep{0%{transform:translateX(-200px)}60%,100%{transform:translateX(480px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
    <defs><clipPath id="f"><rect width="480" height="236" rx="18"/></clipPath>
      <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#8c9dff" stop-opacity="0"/><stop offset=".5" stop-color="#8c9dff" stop-opacity=".9"/><stop offset="1" stop-color="#8c9dff" stop-opacity="0"/></linearGradient>
      <radialGradient id="gl"><stop offset="0" stop-color="#8c9dff" stop-opacity=".22"/><stop offset="1" stop-color="#8c9dff" stop-opacity="0"/></radialGradient></defs>
    <g clip-path="url(#f)">
      <rect width="480" height="236" fill="#11141b"/>
      <circle cx="420" cy="40" r="170" fill="url(#gl)" opacity=".55"/>
      <rect class="sweep" y="0" width="200" height="2" fill="url(#sw)"/>
    </g>
    <rect x=".5" y=".5" width="479" height="235" rx="18" fill="none" stroke="#232836"/>
    <circle cx="33" cy="36" r="4.5" fill="#8c9dff"/>
    <text x="46" y="41" class="mono" font-size="13.5" letter-spacing=".6" fill="#8b93a7">FULL-STACK · Next.js 16</text>
    <text x="27" y="88" class="sans" font-size="31" font-weight="700" letter-spacing="-.6" fill="#eceef3">Agency 3D</text>
    <text x="28" y="124" class="sans" font-size="17.5" fill="#8b93a7">Next.js platform with admin and a 3D front:</text><text x="28" y="150" class="sans" font-size="17.5" fill="#8b93a7">Prisma on Turso, NextAuth, React Three Fiber.</text>
    <rect x="28" y="182" width="106" height="30" rx="15" fill="#161a23" stroke="#232836"/><text x="39" y="202" class="mono" font-size="14" fill="#8b93a7">Next.js 16</text><rect x="142.0" y="182" width="72" height="30" rx="15" fill="#161a23" stroke="#232836"/><text x="153.0" y="202" class="mono" font-size="14" fill="#8b93a7">Prisma</text><rect x="222.4" y="182" width="47" height="30" rx="15" fill="#161a23" stroke="#232836"/><text x="233.4" y="202" class="mono" font-size="14" fill="#8b93a7">R3F</text><rect x="277.6" y="182" width="106" height="30" rx="15" fill="#161a23" stroke="#232836"/><text x="288.6" y="202" class="mono" font-size="14" fill="#8b93a7">Tailwind 4</text>
    <g transform="translate(422,56)"><g class="spin slow"><rect x="-17" y="-17" width="34" height="34" rx="4" fill="none" stroke="#8c9dff" stroke-width="2"/><rect x="-10" y="-10" width="20" height="20" rx="3" fill="#8c9dff" opacity=".35"/></g><g class="spin rev"><rect x="-24" y="-24" width="48" height="48" rx="8" fill="none" stroke="#232836" stroke-width="1.5"/></g></g>
    </svg>